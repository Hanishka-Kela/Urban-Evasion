<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urban Evasion: Safe House Dash</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
      --bg-color: #0d1117;
      --panel-bg: rgba(15, 20, 28, 0.85);
      --border-color: rgba(26, 35, 50, 0.9);
      --cyan: #00e5ff;
      --pink: #ff2a6d;
      --green: #00ff88;
  }
  body {
    background: var(--bg-color);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  #gameCanvas {
    display: block;
    cursor: none;
  }
  #ui-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }
  .hud-panel {
    background: var(--panel-bg);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 16px;
    color: #fff;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  }
  #top-left-panel { position: absolute; top: 24px; left: 24px; width: 200px; }
  .panel-label { font-size: 10px; font-weight: 800; letter-spacing: 2px; margin-bottom: 6px; color: #b0c4de; }
  .armor-wrap { width: 100%; height: 12px; background: #000; border-radius: 6px; overflow: hidden; margin-bottom: 16px; border: 1px solid #223; }
  #armor-fill { height: 100%; background: var(--cyan); width: 100%; box-shadow: 0 0 10px var(--cyan); transition: width 0.2s ease-out; }
  #stars { display: flex; gap: 4px; }
  .star { color: rgba(255,255,255,0.1); font-size: 16px; transition: all 0.3s; }
  .star.lit { color: var(--pink); text-shadow: 0 0 12px var(--pink); transform: scale(1.1); }

  #top-right-panel { position: absolute; top: 24px; right: 24px; display: flex; flex-direction: column; gap: 12px; padding: 18px 20px; }
  .legend-item { display: flex; align-items: center; gap: 12px; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; color: #b0c4de; }
  .dot { width: 10px; height: 10px; border-radius: 50%; }

  #speed-panel {
    position: absolute;
    bottom: 30px; left: 50%;
    transform: translateX(-50%);
    background: var(--panel-bg);
    border: 1px solid rgba(0, 229, 255, 0.2);
    border-radius: 8px;
    padding: 10px 32px;
    text-align: center;
    box-shadow: 0 0 20px rgba(0, 229, 255, 0.1);
    backdrop-filter: blur(10px);
  }
  #speed-value { font-size: 42px; font-weight: 900; color: var(--cyan); text-shadow: 0 0 12px rgba(0, 229, 255, 0.5); line-height: 1; }
  #speed-label { font-size: 10px; font-weight: 800; color: #6a829e; letter-spacing: 3px; margin-top: 4px; }

  #minimap-container {
    position: absolute;
    bottom: 30px; right: 30px;
    border-radius: 50%;
    border: 3px solid var(--cyan);
    box-shadow: 0 0 25px rgba(0, 229, 255, 0.2);
    background: var(--bg-color);
  }
  #minimap { border-radius: 50%; display: block; }

  #screen-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    pointer-events: all;
    background: rgba(10, 15, 20, 0.9);
    backdrop-filter: blur(8px);
    z-index: 100;
  }
  #screen-overlay.hidden { display: none; }
  #overlay-title { font-size: 64px; font-weight: 900; color: #fff; letter-spacing: 10px; text-shadow: 0 0 30px var(--pink); margin-bottom: 12px; text-transform: uppercase; }
  #overlay-subtitle { font-size: 16px; color: var(--cyan); letter-spacing: 4px; margin-bottom: 40px; text-align: center; max-width: 500px; line-height: 1.8; }
  #start-btn {
    background: transparent; color: #fff; border: 2px solid var(--cyan); padding: 16px 56px;
    font-size: 18px; font-weight: 900; letter-spacing: 4px; cursor: pointer; border-radius: 4px; text-transform: uppercase; transition: all 0.2s; box-shadow: 0 0 15px rgba(0,229,255,0.3);
  }
  #start-btn:hover { background: var(--cyan); color: #000; box-shadow: 0 0 25px rgba(0,229,255,0.8); transform: translateY(-2px); }
  .controls-info { margin-top: 36px; color: #aaa; font-size: 13px; letter-spacing: 1.5px; text-align: center; line-height: 2.2; }
  .controls-info span { color: #fff; border: 1px solid #555; padding: 2px 6px; border-radius: 3px; background: rgba(255,255,255,0.1); }
  #collision-flash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 42, 109, 0.35); pointer-events: none; opacity: 0; transition: opacity 0.08s; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="ui-overlay">
  <div id="collision-flash"></div>
  <div class="hud-panel" id="top-left-panel">
    <div class="panel-label">VEHICLE ARMOR</div>
    <div class="armor-wrap"><div id="armor-fill"></div></div>
    <div class="panel-label" style="color:var(--pink)">WANTED LEVEL</div>
    <div id="stars"><span class="star" id="s1">★</span><span class="star" id="s2">★</span><span class="star" id="s3">★</span><span class="star" id="s4">★</span><span class="star" id="s5">★</span></div>
  </div>
  <div class="hud-panel" id="top-right-panel">
    <div class="legend-item"><span class="dot" style="background:var(--green)"></span> A* GPS ROUTE</div>
    <div class="legend-item"><span class="dot" style="background:var(--pink)"></span> POLICE</div>
    <div class="legend-item"><span class="dot" style="background:var(--cyan)"></span> PLAYER</div>
    <div class="legend-item"><span class="dot" style="background:var(--green); box-shadow: 0 0 8px var(--green)"></span> SAFE HOUSE</div>
  </div>
  <div id="speed-panel">
    <div id="speed-value">0</div>
    <div id="speed-label">MPH</div>
  </div>
  <div id="minimap-container"><canvas id="minimap" width="180" height="180"></canvas></div>

  <div id="screen-overlay">
    <div id="overlay-title">URBAN EVASION</div>
    <div id="overlay-subtitle" style="text-transform:none">ESCAPE TO THE SAFE HOUSE</div>
    <button id="start-btn" onclick="startGame()">START ENGINE</button>
    <div class="controls-info">
      <span>W / ↑</span> ACCELERATE &nbsp;|&nbsp; <span>S / ↓</span> BRAKE / REVERSE<br>
      <span>A / ←</span> STEER LEFT &nbsp;|&nbsp; <span>D / →</span> STEER RIGHT<br>
      (Auto-accelerates on turns for drifting)<br>
      Reach the <span style="color:var(--green)">GREEN</span> Safe House · Avoid police & obstacles
    </div>
  </div>
</div>

<script>
// ============================================================
//  TRUE 3D PROJECTION ENGINE
// ============================================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const miniCanvas = document.getElementById('minimap');
const miniCtx = miniCanvas.getContext('2d');

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const CELL = 120;
const ROAD_W = 52;
const COLS = 22;
const ROWS = 22;
const WORLD_W = COLS * CELL;
const WORLD_H = ROWS * CELL;

// 3D SETTINGS
const FOV = 450;
const CAM_HEIGHT = 50;
const CAM_DIST = 160;
const CAM_PITCH = 80;

const roadGrid = [];
function buildCity() {
  for (let r = 0; r < ROWS; r++) {
    roadGrid[r] = [];
    for (let c = 0; c < COLS; c++) { roadGrid[r][c] = false; }
  }
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (r % 3 === 0 || c % 3 === 0) roadGrid[r][c] = true;
    }
  }
  for (let r = 0; r < ROWS; r++) { roadGrid[r][0] = true; roadGrid[r][COLS-1] = true; }
  for (let c = 0; c < COLS; c++) { roadGrid[0][c] = true; roadGrid[ROWS-1][c] = true; }
}
buildCity();

const buildings = [];
const BUILDING_COLORS = ['#2a2a35','#252530','#222230','#1e1e28','#2d2d3a','#201e2a','#1c202b'];
const ROOF_DETAILS = ['#333345','#2e2e40','#303040','#2a283a'];
function generateBuildings() {
  buildings.length = 0;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (!roadGrid[r][c]) {
        buildings.push({
          x: c * CELL + 6, y: r * CELL + 6,
          w: CELL - 12, h: CELL - 12,
          color: BUILDING_COLORS[Math.floor(Math.random()*BUILDING_COLORS.length)],
          roof: ROOF_DETAILS[Math.floor(Math.random()*ROOF_DETAILS.length)],
          elevation: Math.random() * 80 + 60,
          windows: Math.floor(Math.random()*3)+1
        });
      }
    }
  }
}
generateBuildings();

const skidMarks = [];
const obstacles = [];

// ENTITIES
const player = {
  x: 3 * CELL + CELL/2, y: 3 * CELL + CELL/2,
  angle: 0, speed: 0, maxSpeed: 10.5, reverseSpeed: -3.5,
  accel: 0.22, brakeForce: 0.35, friction: 0.96, turnSpeed: 0.055,
  width: 22, height: 38, health: 100, invincible: 0, skidding: false
};

const safeHouse = {
  col: COLS - 4, row: ROWS - 4,
  get x() { return this.col * CELL + CELL/2; },
  get y() { return this.row * CELL + CELL/2; },
  radius: 40, pulse: 0
};
roadGrid[safeHouse.row][safeHouse.col] = true;
roadGrid[safeHouse.row][safeHouse.col - 1] = true;

const policeCars = [];
function spawnPolice() {
  policeCars.length = 0;
  const spawnPoints = [
    { x: 9 * CELL + CELL/2, y: 3 * CELL + CELL/2 },
    { x: 3 * CELL + CELL/2, y: 9 * CELL + CELL/2 },
    { x: 15 * CELL + CELL/2, y: 6 * CELL + CELL/2 },
    { x: 9 * CELL + CELL/2, y: 15 * CELL + CELL/2 }
  ];
  for (let i = 0; i < 4; i++) {
    policeCars.push({
      x: spawnPoints[i].x, y: spawnPoints[i].y,
      angle: 0, speed: 0, maxSpeed: 4.5 + i * 0.4, accel: 0.12, friction: 0.94, turnSpeed: 0.04,
      width: 20, height: 34, lightTimer: 0, lightState: 0
    });
  }
}

// CAMERA
const camera = { x: 3*CELL, y: 3*CELL, angle: 0 };
function updateCamera() {
  camera.x += (player.x - camera.x) * 0.2;
  camera.y += (player.y - camera.y) * 0.2;
  let diff = player.angle - camera.angle;
  while (diff > Math.PI) diff -= Math.PI*2;
  while (diff < -Math.PI) diff += Math.PI*2;
  camera.angle += diff * 0.18;
}

// 3D PROJECTION
function project3D(wx, wy, wz) {
  const camX = camera.x - Math.sin(camera.angle) * CAM_DIST;
  const camY = camera.y + Math.cos(camera.angle) * CAM_DIST; 
  const dx = wx - camX;
  const dy = wy - camY;
  
  const cosT = Math.cos(-camera.angle);
  const sinT = Math.sin(-camera.angle);
  const rx = dx * cosT - dy * sinT;
  const ry = dx * sinT + dy * cosT;
  const depth = -ry;
  
  if (depth < 1) return null; // Behind camera
  if (depth > 6500) return null; // Far clip plane
  
  const scale = FOV / depth;
  const sx = canvas.width / 2 + rx * scale;
  const sy = canvas.height / 2 - (wz - CAM_HEIGHT) * scale + CAM_PITCH;
  
  return { sx, sy, scale, depth };
}

function shadeColor(color, percent) {
    if (!color.startsWith('#')) return color;
    let hex = color.substring(1);
    if (hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2]; // convert #111 to #111111
    let R = parseInt(hex.substring(0,2),16);
    let G = parseInt(hex.substring(2,4),16);
    let B = parseInt(hex.substring(4,6),16);
    R = Math.max(0, Math.min(255, Math.floor(R * (1 - percent))));
    G = Math.max(0, Math.min(255, Math.floor(G * (1 - percent))));
    B = Math.max(0, Math.min(255, Math.floor(B * (1 - percent))));
    return "#" + R.toString(16).padStart(2,'0') + G.toString(16).padStart(2,'0') + B.toString(16).padStart(2,'0'); // Safely pad zeros
}

function drawPoly(pts, color, strokeColor) {
    if (pts.length < 3) return;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(pts[0].sx, pts[0].sy);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].sx, pts[i].sy);
    ctx.closePath();
    ctx.fill();
    if (strokeColor) {
        ctx.strokeStyle = strokeColor;
        ctx.lineWidth = 1;
        ctx.stroke();
    }
}

function drawFace(pts, color, hasWin=false) {
    if (pts.length < 3) return;
    // Cross Product Backface Culling (Calculates CCW screen direction)
    const cross = (pts[1].sx - pts[0].sx) * (pts[2].sy - pts[1].sy) - (pts[1].sy - pts[0].sy) * (pts[2].sx - pts[1].sx);
    if (cross > 0) return; // CW cull prevents drawing inner/back walls of boxes

    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(pts[0].sx, pts[0].sy);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].sx, pts[i].sy);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#12121a';
    ctx.lineWidth = 1;
    ctx.stroke();
    
    if (hasWin) {
        ctx.fillStyle = 'rgba(255,255,200,0.6)';
        const rows = 5, cols = 4;
        for (let r=1; r<rows; r++) {
            for (let c=1; c<cols; c++) {
                if(Math.random()<0.25) continue;
                const ty = r/rows, tx = c/cols;
                const ex1 = pts[0].sx + (pts[3].sx - pts[0].sx)*ty;
                const ey1 = pts[0].sy + (pts[3].sy - pts[0].sy)*ty;
                const ex2 = pts[1].sx + (pts[2].sx - pts[1].sx)*ty;
                const ey2 = pts[1].sy + (pts[2].sy - pts[1].sy)*ty;
                const wx = ex1 + (ex2 - ex1)*tx;
                const wy = ey1 + (ey2 - ey1)*tx;
                ctx.fillRect(wx-1.5, wy-1.5, 3, 3);
            }
        }
    }
}

function drawBox3D(x, y, w, h, angle, baseZ, topZ, color, roofColor, hasWin=false) {
   const pts3D = [];
   const corners = [{cx: -w/2, cy: -h/2}, {cx: w/2, cy: -h/2}, {cx: w/2, cy: h/2}, {cx: -w/2, cy: h/2}];
   const cos = Math.cos(angle), sin = Math.sin(angle);
   for (let c of corners) pts3D.push({wx: x + c.cx * cos - c.cy * sin, wy: y + c.cx * sin + c.cy * cos, wz: baseZ});
   for (let c of corners) pts3D.push({wx: x + c.cx * cos - c.cy * sin, wy: y + c.cx * sin + c.cy * cos, wz: topZ});
   
   const proj = pts3D.map(p => project3D(p.wx, p.wy, p.wz));
   if (proj.some(p => !p || p.depth < 10)) return; // clip entire box if any point traverses behind cam

   // Floor shadow (only if resting on the ground)
   if (baseZ === 0) {
       drawPoly(proj.slice(0, 4), 'rgba(0,0,0,0.6)');
   }

   const faces = [
       { p: [3, 2, 6, 7], c: shadeColor(color, 0.1), w: hasWin },
       { p: [1, 0, 4, 5], c: shadeColor(color, 0.2), w: hasWin },
       { p: [2, 1, 5, 6], c: shadeColor(color, 0.15), w: hasWin },
       { p: [0, 3, 7, 4], c: shadeColor(color, 0.05), w: hasWin },
       { p: [4, 5, 6, 7], c: roofColor, w: false } // Roof
   ];
   
   for (let f of faces) {
       drawFace(f.p.map(idx => proj[idx]), f.c, f.w);
   }
}

function drawCar3D(car, color1, color2, isPolice) {
    // Solid base body block
    drawBox3D(car.x, car.y, car.width, car.height, car.angle, 0, 12, color1, color1, false);
    
    // Windshield Cabin (shorter box shifted slightly to the back of the car base)
    const offset = 4;
    const cx = car.x - Math.sin(car.angle) * offset;
    const cy = car.y + Math.cos(car.angle) * offset;
    drawBox3D(cx, cy, car.width-4, car.height-14, car.angle, 12, 20, '#1c1c24', color2, false);
    
    // Headlights (Very tiny box attached to the front base)
    const hx = car.x + Math.sin(car.angle) * (car.height/2 - 2);
    const hy = car.y - Math.cos(car.angle) * (car.height/2 - 2);
    drawBox3D(hx, hy, car.width-6, 3, car.angle, 6, 10, '#fff', '#fff', false);

    // Police flashing lightbar on top of the cabin
    if (isPolice) {
        const ls = car.lightState;
        const lcolor = (ls===0||ls===1) ? '#ff0055' : '#00e5ff';
        const lx = cx;
        const ly = cy;
        drawBox3D(lx, ly, car.width-6, 4, car.angle, 20, 24, lcolor, '#111', false);
    }
}

function drawLine3D(wx1, wy1, wz1, wx2, wy2, wz2, color, isDashed) {
    const p1 = project3D(wx1, wy1, wz1);
    const p2 = project3D(wx2, wy2, wz2);
    if (!p1 || !p2 || p1.depth < 10 || p2.depth < 10) return;
    
    ctx.beginPath();
    ctx.moveTo(p1.sx, p1.sy);
    ctx.lineTo(p2.sx, p2.sy);
    ctx.strokeStyle = color;
    // Scale stroke line width linearly with projection depth
    const scaleAvg = (p1.scale + p2.scale) / 2;
    ctx.lineWidth = Math.max(1, 10 * scaleAvg);
    if (isDashed) {
        const dashLen = 25 * scaleAvg;
        ctx.setLineDash([dashLen, dashLen]);
    }
    ctx.stroke();
    ctx.setLineDash([]);
}

// ============================================================
//  GAME STATE & A* 
// ============================================================
let gameState = 'menu';
let frameCount = 0;
let wantedLevel = 1;

const keys = {};
window.addEventListener('keydown', e => { keys[e.key] = true; });
window.addEventListener('keyup', e => { keys[e.key] = false; });

class MinHeap {
  constructor() { this.data = []; }
  push(item) { this.data.push(item); this._bubbleUp(this.data.length - 1); }
  pop() {
    const top = this.data[0]; const last = this.data.pop();
    if (this.data.length > 0) { this.data[0] = last; this._sinkDown(0); }
    return top;
  }
  get size() { return this.data.length; }
  _bubbleUp(i) {
    while (i > 0) {
      const p = (i - 1) >> 1;
      if (this.data[p].f <= this.data[i].f) break;
      [this.data[p], this.data[i]] = [this.data[i], this.data[p]]; i = p;
    }
  }
  _sinkDown(i) {
    const n = this.data.length;
    while (true) {
      let s = i, l = 2*i+1, r = 2*i+2;
      if (l < n && this.data[l].f < this.data[s].f) s = l;
      if (r < n && this.data[r].f < this.data[s].f) s = r;
      if (s === i) break;
      [this.data[s], this.data[i]] = [this.data[i], this.data[s]]; i = s;
    }
  }
}

function aStarSearch(sc, sr, gc, gr) {
  sc = Math.max(0, Math.min(COLS-1, sc)); sr = Math.max(0, Math.min(ROWS-1, sr));
  gc = Math.max(0, Math.min(COLS-1, gc)); gr = Math.max(0, Math.min(ROWS-1, gr));
  if (sc === gc && sr === gr) return [];
  const h = (c, r) => Math.abs(c - gc) + Math.abs(r - gr);
  const k = (c, r) => r * COLS + c;
  const o = new MinHeap(), gs = new Map(), f = new Map();
  o.push({ c: sc, r: sr, f: h(sc, sr), g: 0 });
  gs.set(k(sc, sr), 0);
  const d = [[0,-1],[0,1],[-1,0],[1,0]];
  for(let i=0; i<2000 && o.size>0; i++) {
    const curr = o.pop(), {c:cc, r:cr} = curr;
    if (cc === gc && cr === gr) {
      const p = []; let x = k(cc, cr);
      while (f.has(x)) { const [pc, pr] = f.get(x); p.unshift({ c: pc, r: pr }); x = k(pc, pr); }
      p.push({ c: gc, r: gr }); return p;
    }
    const curG = gs.get(k(cc, cr));
    if (curr.g > curG) continue;
    for (const [dc, dr] of d) {
      const nc = cc + dc, nr = cr + dr;
      if (nc < 0 || nc >= COLS || nr < 0 || nr >= ROWS || !roadGrid[nr][nc]) continue;
      const tG = curG + 1, nk = k(nc, nr);
      if (!gs.has(nk) || tG < gs.get(nk)) {
        gs.set(nk, tG); f.set(nk, [cc, cr]);
        o.push({ c: nc, r: nr, f: tG + h(nc, nr), g: tG });
      }
    }
  }
  return [];
}

let gpsPath = [], gpsTimer = 0;
const GPS_RECALC_INTERVAL = 40;
function recalculateGPS() { gpsPath = aStarSearch(Math.floor(player.x/CELL), Math.floor(player.y/CELL), safeHouse.col, safeHouse.row); }

// ============================================================
//  UPDATE LOOP
// ============================================================
function startGame() {
  player.x = 3 * CELL + CELL/2; player.y = 3 * CELL + CELL/2;
  player.angle = 0; player.speed = 0; player.health = 100; player.invincible = 0;
  camera.x = player.x; camera.y = player.y; camera.angle = player.angle;
  skidMarks.length = 0; obstacles.length = 0;
  spawnPolice(); recalculateGPS(); gpsTimer = 0; wantedLevel = 1; frameCount = 0;
  gameState = 'playing';
  document.getElementById('screen-overlay').classList.add('hidden');
  updateHUD();
  window.focus();
}

function showOverlay(title, subtitle, btnText) {
  document.getElementById('overlay-title').textContent = title;
  document.getElementById('overlay-subtitle').textContent = subtitle;
  document.getElementById('start-btn').textContent = btnText;
  document.getElementById('screen-overlay').classList.remove('hidden');
}

function updateHUD() {
  document.getElementById('speed-value').textContent = Math.abs(Math.round(player.speed * 12));
  document.getElementById('armor-fill').style.width = Math.max(0, player.health) + '%';
  document.querySelectorAll('.star').forEach((s, i) => s.classList.toggle('lit', i < wantedLevel));
}

function carsOverlap(ax, ay, aw, ah, aa, bx, by, bw, bh, ba) {
  return Math.hypot(ax - bx, ay - by) < (Math.max(aw,ah) + Math.max(bw,bh)) / 2;
}

function updatePlayer() {
  const forceAccel = (keys['w'] || keys['W'] || keys['ArrowUp']);
  const brake = (keys['s'] || keys['S'] || keys['ArrowDown']);
  const left  = (keys['a'] || keys['A'] || keys['ArrowLeft']);
  const right = (keys['d'] || keys['D'] || keys['ArrowRight']);

  if (forceAccel || left || right) player.speed += player.accel;
  else if (brake) player.speed -= player.brakeForce;
  else player.speed *= player.friction;
  player.speed = Math.max(player.reverseSpeed, Math.min(player.maxSpeed, player.speed));

  const steerF = Math.min(1, Math.max(0.4, Math.abs(player.speed) / (player.maxSpeed * 0.4)));
  if (left)  player.angle -= player.turnSpeed * steerF;
  if (right) player.angle += player.turnSpeed * steerF;

  player.skidding = ((left || right) && Math.abs(player.speed) > 4.0);
  if (player.skidding && frameCount % 3 === 0) {
    const cos = Math.cos(player.angle), sin = Math.sin(player.angle);
    skidMarks.push({ x: player.x - cos*14 - sin*7, y: player.y - sin*14 + cos*7, alpha: 0.55 });
    skidMarks.push({ x: player.x - cos*14 + sin*7, y: player.y - sin*14 - cos*7, alpha: 0.55 });
    if (skidMarks.length > 600) skidMarks.splice(0, 2);
  }

  const prevX = player.x, prevY = player.y;
  let nx = player.x + Math.sin(player.angle) * player.speed;
  let ny = player.y - Math.cos(player.angle) * player.speed;
  let collided = false;
  const radius = Math.max(player.width, player.height) / 2 * 0.7;
  const corners = [{x:nx-radius,y:ny-radius}, {x:nx+radius,y:ny-radius}, {x:nx-radius,y:ny+radius}, {x:nx+radius,y:ny+radius}];
  for (let c of corners) {
    let cl = Math.floor(c.x / CELL), r = Math.floor(c.y / CELL);
    if (r>=0 && r<ROWS && cl>=0 && cl<COLS && !roadGrid[r][cl]) { collided = true; break; }
  }

  if (collided) {
    player.speed *= 0.5;
    let cx=0, cy=0;
    for(let c of [{x:nx-radius,y:prevY-radius},{x:nx+radius,y:prevY-radius},{x:nx-radius,y:prevY+radius},{x:nx+radius,y:prevY+radius}]){
      let r=Math.floor(c.y/CELL), cl=Math.floor(c.x/CELL);
      if(r>=0&&r<ROWS&&cl>=0&&cl<COLS&&!roadGrid[r][cl]) cx=1;
    }
    if(!cx) player.x=nx;
    for(let c of [{x:prevX-radius,y:ny-radius},{x:prevX+radius,y:ny-radius},{x:prevX-radius,y:ny+radius},{x:prevX+radius,y:ny+radius}]){
      let r=Math.floor(c.y/CELL), cl=Math.floor(c.x/CELL);
      if(r>=0&&r<ROWS&&cl>=0&&cl<COLS&&!roadGrid[r][cl]) cy=1;
    }
    if(!cy) player.y=ny;
  } else { player.x = nx; player.y = ny; }

  player.x = Math.max(10, Math.min(WORLD_W-10, player.x));
  player.y = Math.max(10, Math.min(WORLD_H-10, player.y));
  if (player.invincible > 0) player.invincible--;

  if (Math.hypot(player.x - safeHouse.x, player.y - safeHouse.y) < safeHouse.radius + 10) {
    gameState = 'win'; showOverlay('SAFE!', 'You reached the Safe House.\nThe police lost your trail.', 'PLAY AGAIN');
  }

  // Obstacles
  if (Math.random() < 0.05) {
    const sD = 1500 + Math.random() * 400;
    const sx = player.x + Math.sin(player.angle) * sD + (Math.random() - 0.5) * 200;
    const sy = player.y - Math.cos(player.angle) * sD + (Math.random() - 0.5) * 200;
    const c = Math.floor(sx/CELL), r = Math.floor(sy/CELL);
    if (r>=0 && r<ROWS && c>=0 && c<COLS && roadGrid[r][c]) {
      obstacles.push({x: sx, y: sy, type: Math.random() > 0.5 ? 'barrier' : 'cone'});
    }
  }
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const obs = obstacles[i];
    const dist = Math.hypot(obs.x - player.x, obs.y - player.y);
    if (dist > 3000) obstacles.splice(i, 1);
    else if (dist < 22 && player.invincible === 0) {
      player.speed *= 0.3; player.health -= 15; player.invincible = 40; obstacles.splice(i, 1);
      const f = document.getElementById('collision-flash'); f.style.opacity = '1'; setTimeout(() => f.style.opacity = '0', 120);
      wantedLevel = Math.min(5, wantedLevel + 1); updateHUD();
      if (player.health <= 0) { gameState = 'dead'; showOverlay('BUSTED', 'Your vehicle was destroyed.', 'TRY AGAIN'); }
    }
  }
}

function updatePolice() {
  if (gameState !== 'playing') return;
  policeCars.forEach((cop, idx) => {
    cop.lightTimer++; if (cop.lightTimer % 18 === 0) cop.lightState = (cop.lightState + 1) % 4;
    const predX = player.x + Math.sin(player.angle) * player.speed * (40 + idx*10);
    const predY = player.y - Math.cos(player.angle) * player.speed * (40 + idx*10);
    const dT = Math.hypot(cop.x - player.x, cop.y - player.y);
    const tX = dT > 300 ? predX : player.x, tY = dT > 300 ? predY : player.y;
    let aD = Math.atan2(tX-cop.x, -(tY-cop.y)) - cop.angle;
    while(aD > Math.PI) aD -= Math.PI*2; while(aD < -Math.PI) aD += Math.PI*2;
    cop.angle += Math.sign(aD) * Math.min(Math.abs(aD), cop.turnSpeed);
    if (dT > 20) cop.speed += cop.accel; else cop.speed *= 0.9;
    cop.speed = Math.min(cop.maxSpeed, cop.speed * cop.friction + cop.accel);
    let nx = cop.x + Math.sin(cop.angle)*cop.speed, ny = cop.y - Math.cos(cop.angle)*cop.speed;
    let cl = Math.floor(nx/CELL), r = Math.floor(ny/CELL);
    if (r>=0 && r<ROWS && cl>=0 && cl<COLS && !roadGrid[r][cl]) {
       cop.speed *= 0.8;
       if (roadGrid[Math.floor(cop.y/CELL)][Math.floor(nx/CELL)]) cop.x = nx;
       if (roadGrid[Math.floor(ny/CELL)][Math.floor(cop.x/CELL)]) cop.y = ny;
    } else { cop.x = nx; cop.y = ny; }
    cop.x = Math.max(10, Math.min(WORLD_W-10, cop.x)); cop.y = Math.max(10, Math.min(WORLD_H-10, cop.y));

    if (player.invincible === 0 && carsOverlap(cop.x, cop.y, cop.width, cop.height, cop.angle, player.x, player.y, player.width, player.height, player.angle)) {
      player.health -= 18; player.invincible = 80; player.speed *= -0.6;
      const f = document.getElementById('collision-flash'); f.style.opacity = '1'; setTimeout(() => f.style.opacity = '0', 120);
      wantedLevel = Math.min(5, wantedLevel + 1); updateHUD();
      if (player.health <= 0) { gameState = 'dead'; showOverlay('BUSTED', 'The police arrested you.', 'TRY AGAIN'); }
    }
  });
}

// ============================================================
//  RENDER ROUITNES
// ============================================================
function drawMinimap() {
  const MC = miniCanvas.width, MC2 = MC / 2, scale = MC / Math.max(WORLD_W, WORLD_H) * 1.5;
  miniCtx.clearRect(0, 0, MC, MC); miniCtx.save();
  miniCtx.beginPath(); miniCtx.arc(MC2, MC2, MC2 - 2, 0, Math.PI * 2); miniCtx.clip();
  miniCtx.fillStyle = '#11151c'; miniCtx.fillRect(0, 0, MC, MC);
  miniCtx.save(); miniCtx.translate(MC2 - player.x*scale, MC2 - player.y*scale);
  miniCtx.fillStyle = '#1a2332';
  for(let r=0; r<ROWS; r++) for(let c=0; c<COLS; c++)
    if(!roadGrid[r][c]) miniCtx.fillRect(c*CELL*scale, r*CELL*scale, CELL*scale, CELL*scale);
  
  if (gpsPath.length > 1) {
    miniCtx.strokeStyle = 'rgba(0,255,136,0.5)'; miniCtx.lineWidth = 3; miniCtx.lineJoin = 'round';
    miniCtx.beginPath();
    gpsPath.forEach((n, i) => { 
      // Correct object indices derived from MinHeap's aStarSearch tracking
      const nx = (n.c*CELL + CELL/2)*scale, ny = (n.r*CELL + CELL/2)*scale;
      if (i===0) miniCtx.moveTo(nx, ny); else miniCtx.lineTo(nx, ny); 
    });
    miniCtx.stroke();
  }
  
  miniCtx.beginPath(); miniCtx.arc(safeHouse.x*scale, safeHouse.y*scale, 5, 0, Math.PI*2); miniCtx.fillStyle = '#00ff88'; miniCtx.fill();
  policeCars.forEach(cop => { miniCtx.beginPath(); miniCtx.arc(cop.x*scale, cop.y*scale, 4, 0, Math.PI*2); miniCtx.fillStyle = '#ff2a6d'; miniCtx.fill(); });
  miniCtx.restore();
  miniCtx.beginPath(); miniCtx.moveTo(MC2, MC2 - 6); miniCtx.lineTo(MC2 + 5, MC2 + 6); miniCtx.lineTo(MC2 - 5, MC2 + 6);
  miniCtx.fillStyle = '#00e5ff'; miniCtx.fill();
  miniCtx.restore();
}

function render3D() {
  const grad = ctx.createLinearGradient(0, 0, 0, canvas.height/2 + CAM_PITCH);
  grad.addColorStop(0, '#0c121e'); grad.addColorStop(1, '#667799'); 
  ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  ctx.fillStyle = '#11131a';
  ctx.fillRect(0, canvas.height/2 + CAM_PITCH, canvas.width, canvas.height);

  const RENDER_DIST = 20;
  const pc = Math.floor(camera.x / CELL), pr = Math.floor(camera.y / CELL);
  
  for (let r = pr - RENDER_DIST; r < pr + RENDER_DIST; r++) {
    for (let c = pc - RENDER_DIST; c < pc + RENDER_DIST; c++) {
      if (r >= 0 && r < ROWS && c >= 0 && c < COLS && roadGrid[r][c]) {
        const wx = c * CELL, wy = r * CELL;
        const pts = [project3D(wx, wy, 0), project3D(wx + CELL, wy, 0), project3D(wx + CELL, wy + CELL, 0), project3D(wx, wy + CELL, 0)];
        
        if (pts.every(p => p && p.depth > 10)) {
            drawPoly(pts, '#222533', '#11131a');
            
            // Draw perfectly flat 3D polygons for dashed lane markers
            if (r % 3 === 0) {
                for (let k = 0; k < CELL; k += 40) {
                    const m1 = project3D(wx + k, wy + CELL/2 - 2, 0), m2 = project3D(wx + k + 20, wy + CELL/2 - 2, 0);
                    const m3 = project3D(wx + k + 20, wy + CELL/2 + 2, 0), m4 = project3D(wx + k, wy + CELL/2 + 2, 0);
                    if (m1 && m2 && m3 && m4 && m1.depth > 10) drawPoly([m1, m2, m3, m4], 'rgba(234, 204, 68, 0.6)');
                }
            }
            if (c % 3 === 0) {
                for (let k = 0; k < CELL; k += 40) {
                    const m1 = project3D(wx + CELL/2 - 2, wy + k, 0), m2 = project3D(wx + CELL/2 + 2, wy + k, 0);
                    const m3 = project3D(wx + CELL/2 + 2, wy + k + 20, 0), m4 = project3D(wx + CELL/2 - 2, wy + k + 20, 0);
                    if (m1 && m2 && m3 && m4 && m1.depth > 10) drawPoly([m1, m2, m3, m4], 'rgba(234, 204, 68, 0.6)');
                }
            }
        }
      }
    }
  }

  skidMarks.forEach(s => {
      const p = project3D(s.x, s.y, 0);
      if (p && p.depth > 10) {
          ctx.fillStyle = `rgba(0,0,0,${s.alpha})`;
          ctx.beginPath(); ctx.arc(p.sx, p.sy, Math.max(0.5, 4 * p.scale), 0, Math.PI*2); ctx.fill();
      }
  });

  const renderables = [...buildings, ...obstacles];
  if (gameState === 'playing') renderables.push(...policeCars, player);
  else renderables.push(player);

  const all3D = renderables.map(item => {
    let cx = item.x, cy = item.y;
    if (item.elevation !== undefined && item.w !== undefined) { cx += item.w/2; cy += item.h/2; }
    return { item, cx, cy, dist: Math.hypot(cx - camera.x, cy - camera.y) };
  });

  all3D.push({ item: safeHouse, cx: safeHouse.x, cy: safeHouse.y, dist: Math.hypot(safeHouse.x - camera.x, safeHouse.y - camera.y) });

  const sorted3D = all3D.filter(o => o.dist < 3400).sort((a, b) => b.dist - a.dist);

  sorted3D.forEach(obj => {
    const item = obj.item;
    if (item === safeHouse) {
      safeHouse.pulse = (safeHouse.pulse + 0.05) % (Math.PI * 2);
      const pR = safeHouse.radius + Math.sin(safeHouse.pulse) * 8;
      const b1 = project3D(item.x - pR, item.y, 0), b2 = project3D(item.x, item.y - pR, 0);
      const b3 = project3D(item.x + pR, item.y, 0), b4 = project3D(item.x, item.y + pR, 0);
      if (b1 && b2 && b3 && b4 && b1.depth > 10) {
          drawPoly([b1, b2, b3, b4], 'rgba(0, 255, 136, 0.1)', '#00ff88');
          const pt = project3D(item.x, item.y, 800), pb = project3D(item.x, item.y, 0);
          if (pt && pb && pb.depth > 10) {
              const w = Math.max(2, 30 * pb.scale);
              ctx.fillStyle = 'rgba(0, 255, 136, 0.4)';
              ctx.beginPath(); ctx.moveTo(pt.sx - w, pt.sy); ctx.lineTo(pt.sx + w, pt.sy);
              ctx.lineTo(pb.sx + w, pb.sy); ctx.lineTo(pb.sx - w, pb.sy); ctx.fill();
              ctx.fillStyle = '#00ff88'; ctx.font = `bold ${Math.max(12, 35*pt.scale)}px ui-sans-serif`;
              ctx.textAlign = 'center'; ctx.fillText('SAFE HOUSE', pt.sx, pt.sy - 15);
          }
      }
    } else if (item === player) {
      if (player.invincible === 0 || Math.floor(player.invincible / 3) % 2 !== 0) {
        drawCar3D(item, '#00e5ff', '#0099cc', false); // player car custom colors
      }
    } else if (item.maxSpeed !== undefined) {
      drawCar3D(item, '#222', '#eee', true); // police car colors
    } else if (item.type !== undefined) {
      const c1 = item.type === 'cone' ? '#ff3300' : '#888';
      drawBox3D(item.x, item.y, 16, 16, 0, 0, 16, c1, '#fff', false);
    } else {
      drawBox3D(item.x+item.w/2, item.y+item.h/2, item.w, item.h, 0, 0, item.elevation, item.color, item.roof, item.windows > 0);
    }
  });
}

function gameLoop(timestamp) {
  try {
    requestAnimationFrame(gameLoop);
    if (gameState === 'playing') {
      updatePlayer(); updatePolice(); updateCamera();
      gpsTimer++; if (gpsTimer >= GPS_RECALC_INTERVAL) { recalculateGPS(); gpsTimer = 0; }
      if (frameCount % 600 === 0 && wantedLevel < 5) { wantedLevel++; updateHUD(); }
      updateHUD(); frameCount++;
    }
    render3D();
    if (gameState !== 'menu') drawMinimap();
  } catch(err) {
    document.getElementById('overlay-title').textContent = 'ENGINE ERROR';
    document.getElementById('overlay-subtitle').textContent = err.toString();
    document.getElementById('screen-overlay').classList.remove('hidden');
    console.error(err);
  }
}

recalculateGPS();
requestAnimationFrame(gameLoop);
</script>
